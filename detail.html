                window.SCORES_DATA = {};

            if (!item) return null;
            return window.SCORES_DATA[`${item.brand}||${item.name}`] || null;
        }
        // 查得到回傳真實 0-5 分數；查不到回傳 null（該指標顯示「—」資料不足）
        function getNetizenScore(item, indName) {
            const e = getItemEntry(item);
            if (e && e.indicators && e.indicators[indName] != null) return e.indicators[indName];
            return null;

            const color = score < 3.0 ? "#e05a47" : score < 3.5 ? "#e29547" : score < 4.0 ? "#6b7280" : score < 4.5 ? "#f2a7b5" : "#d4af37";
            return `<span class="text-lg font-black" style="color:${color}">${score.toFixed(1)}</span>`;
        }

            const entries = items.map(it => getItemEntry(it)).filter(e => e && e.composite != null);
            const totalMentions = entries.reduce((s, e) => s + (e.mentions || 0), 0);
            const avgComposite = entries.length > 0 ? entries.reduce((s, e) => s + e.composite, 0) / entries.length : null;

            const statBlock = avgComposite != null ? `
                <div class="bg-white/85 backdrop-blur-md rounded-2xl p-6 border border-[#f2a7b5]/10 shadow-sm">
                    <div class="flex justify-between items-center mb-4"><span class="text-base font-black">累積真實社群評論：${totalMentions.toLocaleString()} 則</span><span class="text-[#e05a47] font-black text-xs">平均 ★${avgComposite.toFixed(1)}</span></div>
                    <div class="w-full h-3 bg-gray-100 rounded-full flex overflow-hidden"><div class="h-full bg-gradient-to-r from-[#f2a7b5] to-[#e05a47]" style="width: ${Math.round((avgComposite / 5) * 100)}%"></div></div>
                </div>
            ` : `
                <div class="bg-white/85 backdrop-blur-md rounded-2xl p-6 border border-[#f2a7b5]/10 shadow-sm">
                    <span class="text-sm font-bold text-gray-400">此分類評分資料建置中，敬請期待</span>
                </div>
            `;

            dashboardContainer.innerHTML = `
                <div class="relative z-10 grid grid-cols-1 lg:grid-cols-2 gap-10">
                    <div class="flex flex-col justify-between gap-6">
                        <div>
                            <div class="flex items-center gap-3 mb-4"><span class="text-3xl">📈</span><h3 class="text-2xl font-black italic text-[#2d2d2d]">Glow Makeup 社群評分總覽</h3></div>
                            <div class="flex flex-wrap gap-2 mb-6">${tags.map(t => `<span class="px-3.5 py-1.5 bg-[#2d2d2d] text-white text-xs font-bold rounded-full">#${t}</span>`).join('')}</div>
                            <p class="text-gray-600 leading-relaxed text-sm font-bold">「<span class="text-[#f2a7b5]">${sub}</span>」社群真實評論數據彙整。</p>
                        </div>
                        ${statBlock}
                    </div>
                    <div class="flex flex-col gap-6 justify-center">
                        <h4 class="text-xl font-black italic text-[#2d2d2d] flex items-center gap-2"><span>🎓</span> 專家指標</h4>
                        <div class="flex flex-col gap-4">${kPoints.map(point => `<div class="p-6 bg-white/95 rounded-2xl border border-[#f2a7b5]/20"><div class="flex items-center gap-3 mb-2"><span class="text-lg text-[#f2a7b5]">💡</span><span class="text-base font-black">${point.title}</span></div><p class="text-xs text-gray-700 pl-12">${point.content}</p></div>`).join('')}</div>
                    </div>
                </div>`;
        }

        window.currentSortIndicator = null;
        window.toggleSort = function(indName) {
            window.currentSortIndicator = window.currentSortIndicator === indName ? null : indName;
            if (typeof window.triggerFilteredItemsRender === 'function') window.triggerFilteredItemsRender();
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const sub = params.get('sub');
            const fromContext = params.get('from') || 'board';
            
            if (!sub) {
                document.getElementById('page-title').textContent = '未指定分類';
                return;
            }
            
            const modeLabel = fromContext === 'review' ? '精選評比' : '美妝看板';
            document.getElementById('page-title').textContent = `${modeLabel}：${sub}`;
            document.title = `${sub}${modeLabel} | Glow Makeup`;
            const seoDesc = `Glow Makeup ${modeLabel}：${sub}真實社群評分與網友心得彙整，購物不踩雷。`;
            document.getElementById('meta-description').setAttribute('content', seoDesc);
            document.getElementById('og-title').setAttribute('content', `${sub}${modeLabel} | Glow Makeup`);
            document.getElementById('og-description').setAttribute('content', seoDesc);

            try {
                await loadScoresData();
                const response = await fetch('site-data.json?v=36');
                const data = await response.json();

                const details = data.subcategoryDetails?.[sub];
                if (details) {
                    const selectedBrands = new Set();

                    // Generate unique brands list from items if details.brands is empty
                    let brands = details.brands || [];
                    if (brands.length === 0 && details.items) {
                        const uniqueBrands = new Set(details.items.map(item => item.brand).filter(Boolean));
                        brands = Array.from(uniqueBrands);
                    }

                    // Render Brands list
                    const brandsList = document.getElementById('brands-list');
                    if (brands && brands.length > 0) {
                        brandsList.innerHTML = brands.map(brand => 
                            `<li>
                                <label class="flex items-center gap-3 cursor-pointer group">
                                    <input type="checkbox" value="${brand}" class="brand-checkbox w-4 h-4 rounded border-gray-300 text-[#f2a7b5] focus:ring-[#f2a7b5]">
                                    <span class="text-sm font-bold text-gray-600 group-hover:text-[#f2a7b5] transition-colors">${brand}</span>
                                </label>
                            </li>`
                        ).join('');

                        // Setup dynamic filter event handler
                        brandsList.addEventListener('change', (e) => {
                            if (e.target.classList.contains('brand-checkbox')) {
                                if (e.target.checked) {
                                    selectedBrands.add(e.target.value);
                                } else {
                                    selectedBrands.delete(e.target.value);
                                }
                                window.triggerFilteredItemsRender();
                            }
                        });
                    } else {
                        brandsList.innerHTML = '<li class="text-gray-400 text-sm">暫無品牌資料</li>';
                    }

                    // Dynamic Trend insights render
                    renderTopDashboard(sub, details);

                    // Sections and grid containers
                    const hotItemsSection = document.getElementById('hot-items-section');
                    const hotItemsGrid = document.getElementById('hot-items-grid');
                    const allProductsSection = document.getElementById('all-products-section');
                    const allProductsGrid = document.getElementById('all-products-grid');
                    const reviewTableSection = document.getElementById('review-table-section');
                    const reviewTableContainer = document.getElementById('review-table-container');
                    const articlesSection = document.getElementById('articles-section');
                    const articlesGrid = document.getElementById('articles-grid');

                    // Filter and Render function
                    window.triggerFilteredItemsRender = function() {
                        const rawItems = details.items && details.items.length > 0 ? details.items : [];
                        
                        let displayItems = rawItems.filter(item => {
                            if (selectedBrands.size === 0) return true;
                            return selectedBrands.has(item.brand);
                        });

                        if (fromContext === 'review') {
                            // --- REVIEW MODE ---
                            hotItemsSection.classList.add('hidden');
                            allProductsSection.classList.add('hidden');
                            articlesSection.classList.add('hidden');
                            reviewTableSection.classList.remove('hidden');

                            let indicators = details.indicators || [];
                            if (indicators.length === 0) {
                                indicators = ["整體滿意度", "回購意願", "CP值"];
                            }

                            // 隱藏「所有指標都沒有資料」的品項（該品項根本還沒被評分，顯示一整排 — 沒有意義）
                            displayItems = displayItems.filter(item =>
                                indicators.some(indName => getNetizenScore(item, indName) != null)
                            );

                            // 隱藏「所有品項都沒有資料」的指標欄（例如唇膏的防沾染整欄都是 —）
                            indicators = indicators.filter(indName =>
                                displayItems.some(item => getNetizenScore(item, indName) != null)
                            );
                            // 若排序中的指標被整欄隱藏，取消排序避免卡在不存在的欄位
                            if (window.currentSortIndicator && !indicators.includes(window.currentSortIndicator)) {
                                window.currentSortIndicator = null;
                            }

                            // Dynamic sorting if sorting indicator is selected
                            if (window.currentSortIndicator) {
                                displayItems.sort((a, b) => {
                                    const scoreA = getNetizenScore(a, window.currentSortIndicator);
                                    const scoreB = getNetizenScore(b, window.currentSortIndicator);
                                    return (scoreB ?? -1) - (scoreA ?? -1);
                                });
                            }

                            if (displayItems.length > 0 && indicators.length > 0) {
                                const indicatorHeaders = indicators.map(indName => {
                                    const isSorted = window.currentSortIndicator === indName;
                                    const sortArrow = isSorted ? ' ⬇' : ' ⇅';
                                    const activeClass = isSorted ? 'text-[#f2a7b5] bg-[#f2a7b5]/5 font-black' : 'text-gray-700 hover:bg-gray-50';
                                    return `
                                        <th onclick="toggleSort('${indName}')" class="p-4 md:p-6 text-base ${activeClass} uppercase tracking-wider text-center min-w-[150px] border-b border-[#f2a7b5]/10 cursor-pointer select-none transition-colors">
                                            <div class="flex items-center justify-center gap-1.5">
                                                <span>${indName}</span>
                                                <span class="text-xs opacity-80">${sortArrow}</span>
                                            </div>
                                        </th>
                                    `;
                                }).join('');

                                const rows = displayItems.map((item, idx) => {
                                    const scoreCells = indicators.map((indName, indIdx) => {
                                        const score = getNetizenScore(item, indName);
                                        const cell = (score == null)
                                            ? `<span class="text-gray-300 text-sm font-bold" title="尚無足夠評論資料">—</span>`
                                            : renderScore(score);
                                        return `
                                            <td class="p-4 md:p-6 text-center border-b border-[#f2a7b5]/5">
                                                ${cell}
                                            </td>
                                        `;
                                    }).join('');

                                    // Clicking item title or image goes to item-detail.html?item=...&from=board (as requested: 跳轉至與美妝看板相同詳細頁)
                                    return `
                                        <tr class="hover:bg-[#fff9f5]/60 transition-colors">
                                            <td class="p-4 md:p-6 border-b border-[#f2a7b5]/5 sticky left-0 bg-white/95 backdrop-blur-sm z-10 shadow-[4px_0_8px_rgba(0,0,0,0.02)]">
                                                <div class="flex items-center gap-4">
                                                    <span class="w-7 h-7 flex-shrink-0 bg-gray-100 text-[#2d2d2d] rounded-full flex items-center justify-center font-bold text-sm">${idx + 1}</span>
                                                    <a href="item-detail.html?item=${encodeURIComponent(item.name)}&from=board" class="w-12 h-12 bg-gray-50 rounded-xl p-1 overflow-hidden border border-gray-100/50 flex-shrink-0 hover:scale-105 transition-transform duration-300 block">
                                                        <img src="${item.image || item.img || window.IMG_FALLBACK}" class="w-full h-full object-contain" alt="${item.name}">
                                                    </a>
                                                    <div class="min-w-0">
                                                        <a href="item-detail.html?item=${encodeURIComponent(item.name)}&from=board" class="font-black text-base text-[#2d2d2d] hover:text-[#f2a7b5] transition-colors block truncate max-w-[200px]" title="${item.name}">${item.name}</a>
                                                        <span class="text-xs font-black text-gray-900 tracking-wider uppercase block mt-1">${item.brand}</span>
                                                    </div>
                                                </div>
                                            </td>
                                            ${scoreCells}
                                        </tr>
                                    `;
                                }).join('');

                                reviewTableContainer.innerHTML = `
                                    <div class="overflow-x-auto w-full rounded-3xl border border-[#f2a7b5]/10 bg-white shadow-[0_8px_30px_rgb(242,167,181,0.02)] custom-scrollbar mb-4">
                                        <table class="w-full text-left border-collapse min-w-[900px]">
                                            <thead>
                                                <tr class="bg-gradient-to-r from-[#f2a7b5]/5 to-transparent">
                                                    <th class="p-4 md:p-6 text-base font-black text-gray-700 uppercase tracking-wider min-w-[320px] border-b border-[#f2a7b5]/10 sticky left-0 bg-white z-20">商品項目 (可點擊指標進行排序)</th>
                                                    ${indicatorHeaders}
                                                </tr>
                                            </thead>
                                            <tbody class="divide-y divide-[#f2a7b5]/5">
                                                ${rows}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="text-center text-xl md:text-2xl font-black text-white bg-gradient-to-r from-[#e05a47] to-[#f2a7b5] py-6 px-8 rounded-3xl border-2 border-[#fff]/20 shadow-[0_12px_40px_rgba(224,90,71,0.15)] mt-8 leading-relaxed">
                                        📊 本頁評鑑資料由 Glow Makeup 爬蟲大數據自動分析 1,200+ 篇社群真實使用心得後產出。點選商品名稱或圖片可查看該商品完整的真實網友心得。
                                    </div>
                                `;
                            } else {
                                reviewTableContainer.innerHTML = '<div class="text-gray-400 text-sm text-center py-8">暫無符合篩選條件的商品</div>';
                            }
                        } else {
                            // --- BOARD MODE ---
                            hotItemsSection.classList.remove('hidden');
                            allProductsSection.classList.remove('hidden');
                            articlesSection.classList.add('hidden'); // 沒有真實的分類專屬文章庫，誠實隱藏而非塞樣板文章
                            reviewTableSection.classList.add('hidden');

                            // Spotlight Hot Items：依真實提及則數排序（沒有評分資料的品項一律排最後、不參與熱門排名）
                            const sortedByMentions = [...rawItems].sort((a, b) => {
                                const ma = getItemEntry(a)?.mentions || 0;
                                const mb = getItemEntry(b)?.mentions || 0;
                                return mb - ma;
                            });

                            // Filter and slice top 3 hot items
                            let filteredHotItems = sortedByMentions.filter(item => {
                                if (selectedBrands.size === 0) return true;
                                return selectedBrands.has(item.brand);
                            }).slice(0, 3);

                            if (filteredHotItems.length > 0) {
                                hotItemsGrid.innerHTML = filteredHotItems.map(item => {
                                    const entry = getItemEntry(item);
                                    const hotBadge = (entry && entry.mentions > 0)
                                        ? `<span class="text-xs font-black text-[#e05a47] bg-[#e05a47]/10 px-2.5 py-1 rounded-full flex items-center gap-1 border border-[#e05a47]/20 shadow-sm">🔥 ${entry.mentions} 則真實討論</span>`
                                        : `<span class="text-xs font-bold text-gray-300">資料建置中</span>`;
                                    return `
                                        <div class="bg-white/90 backdrop-blur-md p-6 rounded-3xl border border-[#f2a7b5]/15 shadow-sm hover:border-[#f2a7b5]/40 hover:shadow-xl transition-all duration-300 group flex flex-col justify-between">
                                            <div>
                                                <a href="item-detail.html?item=${encodeURIComponent(item.name)}&from=board" class="aspect-square bg-gray-50 rounded-2xl mb-4 p-4 overflow-hidden flex items-center justify-center border border-gray-100 group-hover:scale-[1.02] transition-transform duration-300 block">
                                                    <img src="${item.image || item.img || window.IMG_FALLBACK}" class="max-h-full max-w-full object-contain group-hover:scale-110 transition-transform duration-500" alt="${item.name}">
                                                </a>
                                                <div class="flex justify-between items-center gap-2 mb-2">
                                                    <span class="text-xs font-black tracking-widest text-[#2d2d2d]/60 uppercase">${item.brand}</span>
                                                    ${hotBadge}
                                                </div>
                                                <a href="item-detail.html?item=${encodeURIComponent(item.name)}&from=board" class="font-black text-lg text-[#2d2d2d] group-hover:text-[#f2a7b5] transition-colors mb-2 block leading-snug line-clamp-2" title="${item.name}">${item.name}</a>
                                            </div>
                                            <a href="item-detail.html?item=${encodeURIComponent(item.name)}&from=board" class="text-xs font-black text-[#f2a7b5] mt-4 flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                                                進入詳細商品頁 ➔
                                            </a>
                                        </div>
                                    `;
                                }).join('');
                            } else {
                                hotItemsGrid.innerHTML = '<div class="col-span-full text-gray-400 text-sm text-center py-8">暫無符合篩選條件的熱門單品</div>';
                            }

                            // All Products Grid（真實分數；沒有評分資料就誠實顯示「尚無評分資料」而非假分數）
                            if (displayItems.length > 0) {
                                allProductsGrid.innerHTML = displayItems.map(item => {
                                    const entry = getItemEntry(item);
                                    const ratingBlock = (entry && entry.composite != null)
                                        ? `<div class="flex items-center gap-1.5">
                                                <span class="text-[#d4af37] text-base font-black">★</span>
                                                <span class="text-sm font-black text-gray-800">${entry.composite.toFixed(1)}</span>
                                                <span class="text-xs text-gray-400 font-bold">(${entry.mentions || 0} 則)</span>
                                           </div>`
                                        : `<span class="text-xs font-bold text-gray-300">尚無評分資料</span>`;
                                    return `
                                    <div class="bg-white p-6 rounded-3xl border border-gray-100 hover:border-[#f2a7b5] hover:shadow-xl transition-all duration-300 group flex flex-col justify-between">
                                        <div>
                                            <a href="item-detail.html?item=${encodeURIComponent(item.name)}&from=board" class="aspect-square bg-gray-50 rounded-2xl mb-4 p-4 overflow-hidden flex items-center justify-center border border-gray-100/50 block">
                                                <img src="${item.image || item.img || window.IMG_FALLBACK}" class="max-h-full max-w-full object-contain group-hover:scale-105 transition-transform duration-500" alt="${item.name}">
                                            </a>
                                            <span class="text-xs font-black text-[#2d2d2d]/50 tracking-wider uppercase block mb-1">${item.brand}</span>
                                            <a href="item-detail.html?item=${encodeURIComponent(item.name)}&from=board" class="font-black text-base text-[#2d2d2d] group-hover:text-[#f2a7b5] transition-colors mb-2 block leading-snug line-clamp-2" title="${item.name}">${item.name}</a>
                                        </div>
                                        <div class="flex items-center justify-between border-t border-gray-50 pt-4 mt-4">
                                            ${ratingBlock}
                                            <a href="item-detail.html?item=${encodeURIComponent(item.name)}&from=board" class="text-xs font-black text-gray-400 group-hover:text-[#f2a7b5] transition-colors">
                                                詳細資料 ➔
                                            </a>
                                        </div>
                                    </div>
                                `;
                                }).join('');
                            } else {
                                allProductsGrid.innerHTML = '<div class="col-span-full text-gray-400 text-sm text-center py-8">暫無符合篩選條件的商品</div>';
                            }
                        }
                    };

                    // Initial Render
                    window.triggerFilteredItemsRender();
                } else {
                    document.getElementById('brands-list').innerHTML = '<li class="text-gray-400 text-sm">無品牌資料</li>';
                }
            } catch(err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
