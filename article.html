    <script>
        function formatDate(d) {
            return (d || '').replace(/-/g, '.');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const root = document.getElementById('article-root');

            const articles = await getArticles();
            const article = articles.find(a => a.id === id);

            if (!article || !article.content) {
                root.innerHTML = `
                    <div class="bg-white rounded-[32px] p-12 shadow-sm border border-[#f2a7b5]/10 text-center">
                        <p class="text-xl font-black text-gray-400 mb-2">找不到這篇文章</p>
                        <p class="text-sm text-gray-400">可能已被移除，或連結不正確。</p>
                    </div>`;
                document.title = '找不到文章 | Glow Makeup';
                return;
            }

            document.title = `${article.title} | Glow Makeup`;
            document.getElementById('meta-description')?.setAttribute('content', article.excerpt || '');
            document.getElementById('og-title')?.setAttribute('content', `${article.title} | Glow Makeup`);
            document.getElementById('og-description')?.setAttribute('content', article.excerpt || '');
            document.getElementById('og-image')?.setAttribute('content', article.image || '');
            document.getElementById('canonical-link')?.setAttribute('href', `https://www.theglowmakeup.org/article.html?id=${encodeURIComponent(article.id)}`);
            const schemaEl = document.getElementById('schema-jsonld');
            if (schemaEl) {
                schemaEl.textContent = JSON.stringify({
                    '@context': 'https://schema.org',
                    '@type': 'Article',
                    headline: article.title,
                    description: article.excerpt || '',
                    image: article.image ? `https://www.theglowmakeup.org/${article.image}` : undefined,
                    datePublished: article.date || undefined,
                    author: { '@type': 'Organization', name: 'Glow Makeup' },
                    publisher: { '@type': 'Organization', name: 'Glow Makeup' },
                    mainEntityOfPage: `https://www.theglowmakeup.org/article.html?id=${encodeURIComponent(article.id)}`,
                    isPartOf: { '@type': 'Blog', name: '保養專欄', '@id': 'https://www.theglowmakeup.org/skincare-blog.html' },
                });
            }
            (function(){var el=document.getElementById('breadcrumb-jsonld');if(!el)return;var isEvent=article.category==='活動';var L=[['首頁','https://www.theglowmakeup.org/']];if(isEvent){L.push(['活動快訊','https://www.theglowmakeup.org/skincare-blog.html?category='+encodeURIComponent('活動')]);}else{L.push(['保養專欄','https://www.theglowmakeup.org/skincare-blog.html']);if(article.category){L.push([article.category,'https://www.theglowmakeup.org/skincare-blog.html?category='+encodeURIComponent(article.category)]);}}L.push([article.title,'https://www.theglowmakeup.org/article.html?id='+encodeURIComponent(article.id)]);el.textContent=JSON.stringify({'@context':'https://schema.org','@type':'BreadcrumbList',itemListElement:L.map(function(x,i){return {'@type':'ListItem',position:i+1,name:x[0],item:x[1]};})});})();

            const shareUrl = `https://www.theglowmakeup.org/article.html?id=${encodeURIComponent(article.id)}`;
            const shareText = article.title;
            const SHARE_BTN = 'inline-flex items-center gap-2 px-4 py-2.5 rounded-full text-sm font-black transition-all hover:-translate-y-0.5 hover:shadow-md';

                    <p class="text-sm font-black text-[#2d2d2d] mb-4">分享這篇文章</p>
                    <div class="flex flex-wrap items-center gap-3">
                        <a href="https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(shareUrl)}" target="_blank" rel="noopener noreferrer" aria-label="分享到 LINE" class="${SHARE_BTN} bg-[#06C755] text-white">

                            LINE
                        </a>
                        <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}" target="_blank" rel="noopener noreferrer" aria-label="分享到 Facebook" class="${SHARE_BTN} bg-[#1877F2] text-white">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06c0 5.02 3.66 9.18 8.44 9.94v-7.03H7.9v-2.91h2.54V9.85c0-2.52 1.49-3.91 3.77-3.91 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.78-1.63 1.57v1.89h2.78l-.45 2.91h-2.33V22c4.78-.76 8.44-4.92 8.44-9.94Z"/></svg>
                            Facebook
                        </a>
                        <a href="https://www.threads.net/intent/post?text=${encodeURIComponent(shareText + ' ' + shareUrl)}" target="_blank" rel="noopener noreferrer" aria-label="分享到 Threads" class="${SHARE_BTN} bg-[#2d2d2d] text-white">
                            <svg width="17" height="17" viewBox="0 0 192 192" fill="currentColor" aria-hidden="true"><path d="M141.5 89.7c-.8-.4-1.7-.8-2.5-1.1-1.5-27.4-16.5-43-41.6-43.2h-.3c-15 0-27.5 6.4-35.2 18l13.8 9.5c5.7-8.7 14.7-10.5 21.4-10.5h.2c8.3.1 14.6 2.5 18.6 7.1 2.9 3.4 4.9 8 5.9 13.9-7.5-1.3-15.6-1.7-24.2-1.2-24 1.4-39.5 15.4-38.4 34.9.5 9.9 5.5 18.4 13.9 23.9 7.1 4.7 16.3 7 25.9 6.5 12.6-.7 22.5-5.5 29.4-14.3 5.3-6.7 8.6-15.4 10.1-26.3 6.1 3.7 10.7 8.6 13.2 14.5 4.3 10 4.5 26.4-8.9 39.8-11.7 11.7-25.8 16.8-47.1 16.9-23.6-.2-41.5-7.8-53.1-22.5C32.6 137.8 27 117.4 27 96c0-21.4 5.6-41.8 16.5-55.6C55.1 25.7 73 18.1 96.6 18c23.8.2 41.9 7.8 53.9 22.6 5.9 7.3 10.3 16.4 13.2 27l16.2-4.3c-3.5-13.1-9.1-24.3-16.6-33.6C147.9 11.3 125.1 1.2 96.7 1h-.1C68.3 1.2 45.7 11.3 30.9 31.1 17.7 48.7 10.9 73.2 10.8 96v.1c.1 22.8 6.9 47.3 20.1 64.9C45.7 180.7 68.3 190.8 96.6 191h.1c25.2-.2 43-6.8 57.6-21.5 19.2-19.2 18.6-43.2 12.3-57.9-4.6-10.6-13.2-19.2-25.1-25.9ZM99 128.2c-10.6.6-21.6-4.2-22.1-14-.4-7.3 5.2-15.4 22.8-16.4 2-.1 4-.2 5.9-.2 6.4 0 12.4.6 17.8 1.8-2 25.2-13.9 28.4-24.4 28.8Z"/></svg>
                            Threads
                        </a>
                        <button type="button" id="copy-link-btn" aria-label="複製文章連結" class="${SHARE_BTN} bg-[#fdeef1] text-[#2d2d2d] border border-[#f2a7b5]/30">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
                            <span id="copy-link-label">複製連結</span>
                        </button>
                    </div>
                </div>`;
            root.innerHTML = `
                <article class="bg-white rounded-[32px] p-8 md:p-12 shadow-sm border border-[#f2a7b5]/10">
                    <span class="bg-[#f2a7b5] text-white px-4 py-1 rounded-full text-xs font-bold tracking-widest">${article.tag ? '#' + article.tag : '保養專欄'}</span>
                    <h1 class="text-2xl md:text-4xl font-black text-[#2d2d2d] leading-tight mt-4 mb-2">${article.title}</h1>
                    <p class="text-sm text-gray-400 font-bold mb-8">${formatDate(article.date)}</p>
                    <img src="${article.image}" alt="${article.title}" class="w-full rounded-3xl mb-8 object-cover max-h-[420px]" onerror="this.src=window.IMG_FALLBACK">
                    <div class="article-body">${article.content}</div>
                    ${shareBar}
                </article>`;

            const copyBtn = document.getElementById('copy-link-btn');
            if (copyBtn) {
                copyBtn.addEventListener('click', async () => {
                    const label = document.getElementById('copy-link-label');
                    try {
                        await navigator.clipboard.writeText(shareUrl);
                    } catch (e) {
                        const ta = document.createElement('textarea');
                        ta.value = shareUrl; ta.style.position = 'fixed'; ta.style.opacity = '0';
                        document.body.appendChild(ta); ta.select();
                        try { document.execCommand('copy'); } catch (e2) {}
                        document.body.removeChild(ta);
                    }
                    if (label) {
                        label.textContent = '已複製！';
                        setTimeout(() => { label.textContent = '複製連結'; }, 1800);
                    }
                });
            }

            const more = articles.filter(a => a.id !== id).slice(0, 4);
            if (more.length) {
                document.getElementById('more-section').classList.remove('hidden');
                document.getElementById('more-grid').innerHTML = more.map(a => `
                    <a href="${a.url || 'skincare-blog.html'}" class="flex gap-4 bg-white p-4 rounded-3xl border border-[#f2a7b5]/10 shadow-sm hover:shadow-md transition-all">
                        <img src="${a.image}" class="w-24 h-24 object-cover rounded-2xl shrink-0" alt="${a.title}" onerror="this.src=window.IMG_FALLBACK">
                        <div class="min-w-0">
                            <span class="text-xs font-black text-gray-400">${formatDate(a.date)}${a.tag ? ' · #' + a.tag : ''}</span>
                            <h4 class="font-black text-sm leading-snug mt-1 line-clamp-2">${a.title}</h4>
                        </div>
                    </a>
                `).join('');
            }
        });
